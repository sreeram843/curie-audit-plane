[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "curie-audit-plane"
version = "0.1.0"
description = "Clinical AI Flight Recorder for verifiable provenance around FHIR-to-LLM workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=43.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlmodel>=0.0.22",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
curie-audit-plane = "curie_audit_plane.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/curie_audit_plane"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/curie_audit_plane/api/app.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "--cov=curie_audit_plane --cov-report=term-missing --cov-fail-under=80"
markers = [
    "integration: exercises the full pipeline or HTTP API",
    "evaluation: ARC and tamper-detection benchmark",
]

[tool.coverage.run]
source = ["src/curie_audit_plane"]
omit = ["src/curie_audit_plane/cli.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
