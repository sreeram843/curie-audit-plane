name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Tests and coverage
        run: pytest --cov=curie_audit_plane --cov-fail-under=80
      - name: Secret scan
        run: |
          if git grep -nE 'sk-[A-Za-z0-9]{10,}|BEGIN (RSA |OPENSSH )?PRIVATE KEY' -- ':!.github/**' ':!*.md'; then
            echo "Possible secret material found"
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
      - run: npm run build
